name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  JAVA_VERSION: "17"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Bump version in pubspec
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.build }}/" pubspec.yaml
          grep "^version:" pubspec.yaml

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 kosong, release ditandatangani dengan debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=release.keystore"
          } > android/key.properties

      - name: Fetch fonts
        continue-on-error: true
        run: bash scripts/fetch_fonts.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Build AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Generate changelog
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            range="${GITHUB_REF_NAME}"
          else
            range="${previous}..${GITHUB_REF_NAME}"
          fi
          {
            echo "## Perubahan"
            echo
            git log "$range" --no-merges --pretty=format:"- %s (%h)"
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/onyx-${{ steps.version.outputs.tag }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/onyx-${{ steps.version.outputs.tag }}.aab"
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt "dist/mapping-${{ steps.version.outputs.tag }}.txt"
          fi
          (cd dist && sha256sum * > "SHA256SUMS.txt")

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*

  bump:
    name: Commit version bump
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Write version to main
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag#v}"
          sed -i "s/^version: .*/version: ${name}+${GITHUB_RUN_NUMBER}/" pubspec.yaml
          if git diff --quiet; then
            echo "Tidak ada perubahan versi"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${name}+${GITHUB_RUN_NUMBER}"
          git push origin main
