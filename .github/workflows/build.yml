name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Jenis build"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - debug
          - release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Check source files for forbidden comments
        run: python3 scripts/check_no_comments.py

      - name: ktlint
        continue-on-error: true
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint
          ./ktlint "android/app/src/main/kotlin/**/*.kt"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter test
        run: flutter test

  build:
    name: Build ${{ matrix.mode }}
    needs: [analyze, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release]
    steps:
      - name: Skip unselected build type
        id: gate
        run: |
          selected="${{ github.event.inputs.build_type || 'both' }}"
          if [ "$selected" = "both" ] || [ "$selected" = "${{ matrix.mode }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.run == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.run == 'true'
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Cache Android NDK
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: ndk-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}

      - name: Fetch fonts
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: bash scripts/fetch_fonts.sh

      - name: Fetch proot
        if: steps.gate.outputs.run == 'true'
        run: bash scripts/fetch_proot.sh

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: flutter pub get

      - name: Build APK
        if: steps.gate.outputs.run == 'true'
        run: flutter build apk --${{ matrix.mode }}

      - name: Build AAB
        if: steps.gate.outputs.run == 'true' && matrix.mode == 'release'
        run: flutter build appbundle --release

      - name: Kotlin unit tests
        if: steps.gate.outputs.run == 'true' && matrix.mode == 'debug'
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload APK
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: onyx-${{ matrix.mode }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.mode }}.apk
          retention-days: 30

      - name: Upload AAB
        if: steps.gate.outputs.run == 'true' && matrix.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: onyx-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload mapping
        if: steps.gate.outputs.run == 'true' && matrix.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: onyx-release-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: ignore
