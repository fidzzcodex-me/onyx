name: onyx
description: Onyx - terminal, file manager, SFTP/SSH client, editor dan viewer dalam satu aplikasi Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  path: ^1.9.0
  path_provider: ^2.1.5

  xterm: ^4.0.0

  video_player: ^2.9.2
  chewie: ^1.8.5
  just_audio: ^0.9.42
  photo_view: ^0.15.0

  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.8.0

  file_picker: ^8.1.6
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/shell/
    - assets/default_config/
    - assets/google_fonts/
